<style>
html{-webkit-text-size-adjust:100%}

/* Layout: en-tête compact avec la semaine en cours, onglets, puis panneaux de travail empilés (tableaux défilants sur mobile) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --line:#d6dde4;
  --ink:#14202c; --muted:#5a6a79; --brand:#0e2e4d; --accent:#c19a4b; --accent-ink:#1b1405;
  --ok:#2f7d4f; --ok-bg:#dff1e6; --warn:#a86400; --warn-bg:#fbedd2; --bad:#b33a2e; --bad-bg:#f8dfdb; --info:#2c5d8a; --info-bg:#dde9f5;
  --future:#e6eaee;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --surface-2:#1e2a36; --line:#2b3a48;
  --ink:#e6edf3; --muted:#93a3b2; --brand:#9cc3e4; --accent:#d4b06a; --accent-ink:#1b1405;
  --ok:#6fcf97; --ok-bg:#183a28; --warn:#f0b452; --warn-bg:#3b2b10; --bad:#f08a7e; --bad-bg:#3d1c19; --info:#8ab8e6; --info-bg:#1a2e44;
  --future:#22303d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --surface-2:#1e2a36; --line:#2b3a48;
  --ink:#e6edf3; --muted:#93a3b2; --brand:#9cc3e4; --accent:#d4b06a; --accent-ink:#1b1405;
  --ok:#6fcf97; --ok-bg:#183a28; --warn:#f0b452; --warn-bg:#3b2b10; --bad:#f08a7e; --bad-bg:#3d1c19; --info:#8ab8e6; --info-bg:#1a2e44;
  --future:#22303d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:48px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:0 0 0 1px var(--line)}
.mark img{width:100%;height:100%;object-fit:contain}
.logo-tile{background:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:center}

.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:6px}
.votebtns{display:flex;gap:8px;flex-wrap:wrap}
.votebtns .btn[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.scrutin{border-left:4px solid var(--accent)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}

section.panel{display:flex;flex-direction:column;gap:18px;padding-top:8px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}

td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}

td.wrap{white-space:normal;min-width:180px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mute{background:var(--surface-2);color:var(--muted)}
.bar{width:90px;height:6px;background:var(--surface-2);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{font:500 14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.full{grid-column:1/-1}
.btn{font:700 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;background:var(--surface-2);border-radius:7px;padding:8px 10px;color:var(--ink)}
.heat{overflow-x:auto}
.heat table td,.heat table th{padding:3px 2px;border:none}
.heat td.name{padding-right:10px;font-size:12px;position:sticky;left:0;background:var(--surface);z-index:1}
.cell{width:16px;height:16px;border-radius:3px;display:block}
.c-ok{background:var(--ok)} .c-late{background:var(--warn)} .c-tardif{background:var(--bad);opacity:.55} .c-fm{background:var(--info)} .c-due{background:var(--bad)} .c-open{background:transparent;border:2px dashed var(--accent)} .c-future{background:var(--future)} .c-none{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:12px;height:12px}
.heat th.wk{font-size:9.5px;font-weight:500;writing-mode:vertical-rl;transform:rotate(180deg);height:44px;color:var(--muted);letter-spacing:0;text-transform:none}
pre.msg{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--surface-2);border-radius:8px;padding:12px;margin:0;max-height:360px;overflow:auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);padding:8px 10px;border-radius:7px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.ro .w-only{display:none!important}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{max-width:380px;margin:48px auto;display:flex;flex-direction:column;gap:14px}
.auth .card{gap:14px}
.auth .tabs2{display:flex;gap:6px}
.auth .tabs2 button{flex:1}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark"><img src="img/logo-mark.png" alt="Logo ADF"></div>
      <div><h1>Groupement ADF</h1><p>Apporteur de financement · cycle 2026–2027</p></div>
    </div>
    <div class="row"><div class="weekbox" id="weekbox"></div><button class="btn" id="btnExport" hidden>Exporter en Excel</button></div>
    <div class="who" id="who" hidden></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="banners"></div>
  <main id="main"><div class="empty">Chargement des données du groupement…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
// ---------- état ----------
const S = { auth:'loading', user:null, role:null, roles:[], myMembreId:null, scrutins:[], votes:{}, authMode:'login', cfg:null, membres:[], cots:[], fm:[], tres:[], decs:[], ready:{}, canWrite:false, dbOk:null, tab:'dash', filtre:'', editCot:null, confirm:null, simDate:null, redist:null, semMsg:null };
let db = null;
const DEF = { cotisation:1000, objectif:100000, debut:'2026-08-15', semaines:52, echeance:'2027-08-31', heure:'17:00', tauxRetard:5, tauxSortie:20, tauxCloture:10, tauxJour:1, maxFM:3, bureau:{president:'',tresorier:'',secretaire:''}, sim:{titulaire:'FADONOUGBO Florent', code:'KODJO Apolinaire', garde:'GANGBALA Donatien'}, releve:null };
const cfg = () => Object.assign({}, DEF, S.cfg||{});

// ---------- dates ----------
const D = s => { const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const S2 = n => new Date(n*864e5).toISOString().slice(0,10);
const dow = n => new Date(n*864e5).getUTCDay();
const fr = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const frc = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}`; };
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function nowLocal(){ const n=new Date(); const p=x=>String(x).padStart(2,'0'); return { date:`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`, heure:`${p(n.getHours())}:${p(n.getMinutes())}` }; }
const nextSat = n => n + ((6 - dow(n) + 7) % 7);
const F = x => Math.round(x||0).toLocaleString('fr-FR').replace(/ | /g,' ') ;
const FF = x => F(x)+' F';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- logique métier ----------
function weeksAll(){ const c=cfg(); const g=D(c.debut); return Array.from({length:c.semaines},(_,k)=>g+7*k); }
function deadlinePassed(w, now){ const t=D(now.date); return t>w || (t===w && now.heure>=cfg().heure); }
function currentWeek(now){ const t=D(now.date); let w=nextSat(t); if(dow(t)===6 && now.heure>=cfg().heure) w=t+7; return w; }
// semaine de référence = dernier samedi dont l'échéance est passée (ou samedi courant)
function lastDueWeek(now){ const t=D(now.date); let w=t-((dow(t)+1)%7); if(dow(t)===6 && now.heure<cfg().heure) w-=7; return w; }
const memById = id => S.membres.find(m=>m.id===id);
const actifs = () => S.membres.filter(m=>m.statut==='actif').sort(byOrdre);
const comptes = () => S.membres.filter(m=>m.statut==='actif'||m.statut==='demission'||m.statut==='exclu').sort(byOrdre);
function byOrdre(a,b){ return (a.ordre??99)-(b.ordre??99) || a.nom.localeCompare(b.nom); }

function memberWeeks(m){
  const all=weeksAll(); const st=D(m.debut||cfg().debut);
  const end = m.sortie?.date ? D(m.sortie.date) : Infinity;
  return all.filter(w=>w>=st && w<=end);
}
function fmValid(mid, w){ return S.fm.some(f=>f.membreId===mid && f.statut==='validee' && D(f.semaine)===w); }
function payOrder(a,b){ return (a.date+(a.heure||'00:00')+(a.cree||'')).localeCompare(b.date+(b.heure||'00:00')+(b.cree||'')); }

// Ventile les versements: 1 000 F par semaine due (les plus anciennes d'abord, jamais au-delà de la semaine en cours du versement), le surplus va à la part libre
function analyse(m, extra, now){
  now = now || nowLocal(); const c=cfg();
  const pays = S.cots.filter(p=>p.membreId===m.id && (!extra || !S.editCot || p.id!==S.editCot)).concat(extra?[extra]:[]).sort(payOrder);
  const wk = memberWeeks(m).map(w=>({w, pay:null, state:null}));
  let total=0, libre=0, pen=0; const news=[];
  for(const p of pays){
    const mt=+p.montant||0; total+=mt; pen+=+p.penalite||0;
    const d=D(p.date); let cur=nextSat(d);
    let amt=mt;
    for(const x of wk){ if(x.w>cur) break; if(x.pay) continue; if(amt<c.cotisation) break; x.pay=p; amt-=c.cotisation; if(p===extra) news.push(x); }
    libre+=amt;
  }
  let dues=0, lateCount=0, manq=0, fmUsed=0;
  for(const x of wk){
    const fm=fmValid(m.id,x.w); if(fm) fmUsed++;
    if(x.pay){
      const d=D(x.pay.date), h=x.pay.heure||'00:00';
      const ontime = d<x.w || (d===x.w && h<=c.heure);
      if(ontime) x.state='ok';
      else if(d<=x.w+4) x.state = fm?'fm':'late';
      else { x.state='tardif'; manq++; }
      if(x.state==='late'||x.state==='tardif') lateCount++;
    } else if(deadlinePassed(x.w, now)){
      x.state = (fm && D(now.date)<=x.w+4) ? 'fm' : 'due'; if(x.state==='due'){ dues++; if(D(now.date)>x.w+4) manq++; }
    } else x.state = (x.w===currentWeek(now)) ? 'open' : 'future';
  }
  const oblig = wk.length*c.cotisation; // obligatoire total sur le cycle
  const obligCouvert = wk.filter(x=>x.pay).length*c.cotisation;
  const restant = Math.max(0,c.objectif-total);
  const ech=D(c.echeance), t=D(now.date);
  const semRest = Math.max(1, Math.ceil((ech-t)/7));
  const obligRest = wk.filter(x=>!x.pay).length*c.cotisation;
  const libreCible = Math.max(0,c.objectif-oblig);
  const libreRest = Math.max(0, restant-obligRest);
  let statut='ok'; if(dues>0) statut = manq>0?'bad':'warn';
  return {wk,total,libre,pen,dues,lateCount,manq,fmUsed,oblig,obligCouvert,restant,libreCible,libreRest,rythme:libreRest/semRest,semRest,statut,news};
}

function soldeTheorique(){
  let s=0; for(const p of S.cots) s+=(+p.montant||0)+(+p.penalite||0);
  for(const t of S.tres) s+= TRES_TYPES[t.type]?.sign*(+t.montant||0) || 0;
  return s;
}
// Chaque pénalité est répartie entre les membres au prorata de leurs cotisations cumulées à la date où elle est payée
function repartPenalites(){
  const pens = S.cots.filter(p=>+p.penalite>0).sort(payOrder);
  const pool = S.membres.filter(m=>m.statut!=='candidat');
  const parM = Object.fromEntries(pool.map(m=>[m.id,0]));
  const rows = pens.map(p=>{
    const base={}; let tot=0;
    for(const m of pool){
      if(m.sortie?.date && m.sortie.date < p.date) continue;
      const b=S.cots.filter(c=>c.membreId===m.id && c.date<=p.date).reduce((s,c)=>s+(+c.montant||0),0);
      if(b>0){ base[m.id]=b; tot+=b; }
    }
    const parts={}; for(const [id,b] of Object.entries(base)){ parts[id]=+p.penalite*b/tot; parM[id]+=parts[id]; }
    return {p, tot, base, parts};
  });
  return {rows, parM, total:pens.reduce((s,p)=>s+(+p.penalite||0),0), pool};
}
const TRES_TYPES = {
  interet:{l:'Intérêt / bonus MoMo',sign:1}, entree:{l:'Autre entrée',sign:1}, retour:{l:"Retour d'investissement",sign:1},
  frais:{l:'Frais de retrait/transfert',sign:-1}, invest:{l:'Investissement',sign:-1}, rembours:{l:'Remboursement membre sortant',sign:-1}, retrait:{l:'Autre retrait',sign:-1}
};

// ---------- db ----------
const COLS = { membres:'membres', cots:'cotisations', fm:'forcemajeure', tres:'tresorerie', decs:'decisions' };
let fbAuth=null, unsubs=[];
async function boot(){
  const conf = window.ADF_FIREBASE_CONFIG;
  if(!window.firebase || !conf || !conf.apiKey){ S.dbOk=false; S.auth='noconfig'; render(); return; }
  firebase.initializeApp(conf);
  fbAuth = firebase.auth(); db = firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){}
  fbAuth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f()); unsubs=[]; S.ready={};
    if(!u){ S.user=null; S.auth='login'; S.dbOk=null; render(); return; }
    S.user=u; S.auth='loading'; render();
    const isOwner = u.email && u.email.toLowerCase()===String(window.ADF_OWNER_EMAIL||'').toLowerCase();
    let role=null;
    try{
      const r=await db.collection('roles').doc(u.uid).get();
      if(r.exists) role=r.data().role;
      else { await db.collection('roles').doc(u.uid).set({role:'attente', email:u.email||'', cree:stamp()}); role='attente'; }
    }catch(e){ role = isOwner ? 'bureau' : 'attente'; }
    if(isOwner) role='bureau';
    S.role=role;
    if(isOwner && !u.emailVerified){ S.auth='verify'; render(); return; }
    if(role!=='bureau' && role!=='membre'){ S.auth='attente'; render(); return; }
    S.auth='ok'; S.dbOk=true; S.canWrite = role==='bureau';
    document.getElementById('btnExport').hidden=false;
    unsubs.push(db.doc('adf/config').onSnapshot(s=>{ S.cfg=s.exists?s.data():null; S.ready.cfg=true; schedule(); }, onErr));
    for(const [k,c] of Object.entries(COLS)){
      unsubs.push(db.collection(c).onSnapshot(q=>{ S[k]=q.docs.map(x=>Object.assign({id:x.id},x.data())); S.ready[k]=true; schedule(); }, onErr));
    }
    unsubs.push(db.collection('roles').doc(u.uid).onSnapshot(r=>{ const d=r.exists?r.data():{}; S.myMembreId=d.membreId||null; schedule(); }, ()=>{}));
    const voteSubs={};
    unsubs.push(()=>Object.values(voteSubs).forEach(f=>f()));
    unsubs.push(db.collection('scrutins').onSnapshot(q=>{
      S.scrutins=q.docs.map(x=>Object.assign({id:x.id},x.data()));
      for(const sc of S.scrutins) if(!voteSubs[sc.id]) voteSubs[sc.id]=db.collection('scrutins').doc(sc.id).collection('votes').onSnapshot(v=>{ S.votes[sc.id]=v.docs.map(x=>Object.assign({id:x.id},x.data())); schedule(); }, ()=>{});
      for(const id of Object.keys(voteSubs)) if(!S.scrutins.some(x=>x.id===id)){ voteSubs[id](); delete voteSubs[id]; delete S.votes[id]; }
      schedule();
    }, onErr));
    if(S.canWrite) unsubs.push(db.collection('roles').onSnapshot(q=>{ S.roles=q.docs.map(x=>Object.assign({id:x.id},x.data())); schedule(); }, ()=>{}));
  });
}
function onErr(e){ if(e?.code==='permission-denied'){ toast("Accès refusé à certaines données."); return; } toast('Connexion aux données interrompue. Rechargez la page.'); }
let raf=0; function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; render(true);}); }
async function save(col, id, data){
  if(!S.canWrite){ toast('Consultation seule : modification impossible.'); return false; }
  try{ const ref = id ? db.collection(col).doc(id) : db.collection(col).doc(); await ref.set(data); return true; }
  catch(e){ if(e?.code==='permission-denied'){ S.canWrite=false; render(); toast("Vous n'avez pas le droit de modifier ces données."); } else toast('Enregistrement impossible, réessayez.'); return false; }
}
async function upd(col,id,data){ try{ await db.collection(col).doc(id).update(data); return true;}catch(e){ toast('Mise à jour impossible.'); return false; } }
async function del(col,id){ try{ await db.collection(col).doc(id).delete(); toast('Supprimé.'); }catch(e){ toast('Suppression impossible.'); } }

function updHint(){
  const el=document.getElementById('c_hint'); if(!el) return;
  const m=memById(v('c_m')); const date=v('c_d'); if(!m||!date){ el.textContent='Choisissez un membre et une date.'; return; }
  const c=cfg(); const p={id:'_new', membreId:m.id, date, heure:v('c_h'), montant:+v('c_a')||0, penalite:0};
  const a=analyse(m,p);
  const cov=a.news.map(x=>x);
  const late=cov.filter(x=>x.state==='late'||x.state==='tardif');
  const libre = p.montant - cov.length*c.cotisation;
  const sugg = late.length*Math.round(c.cotisation*c.tauxRetard/100);
  const parts=[];
  if(cov.length) parts.push(`Couvre ${cov.length>1?'les samedis':'le samedi'} ${cov.map(x=>frc(S2(x.w))+(x.state==='late'?' (en retard)':x.state==='tardif'?' (après mercredi)':x.state==='fm'?' (force majeure)':'')).join(', ')}`);
  else parts.push('Aucune semaine obligatoire due à couvrir');
  if(libre>0) parts.push(`${FF(libre)} vers la part libre`);
  parts.push(sugg?`pénalité suggérée : ${FF(sugg)}`:'aucune pénalité');
  el.textContent = parts.join(' · ')+'.';
  const pe=document.getElementById('c_p'); if(pe && !S.editCot && pe.dataset.touched!=='1') pe.value=sugg;
}
function waMsg(w, now){
  const c=cfg(); const ms=actifs();
  const ok=[], late=[], fm=[], due=[];
  let tot=0;
  for(const m of ms){ const a=analyse(m,null,now); tot+=a.total; const x=a.wk.find(y=>y.w===w); if(!x) continue;
    if(x.state==='ok') ok.push(m.nom); else if(x.state==='late'||x.state==='tardif') late.push(m.nom); else if(x.state==='fm') fm.push(m.nom); else if(x.state==='due') due.push(m.nom); }
  const L=[`*GROUPEMENT ADF : point des cotisations*`,`Semaine du samedi ${fr(S2(w))}`,''];
  L.push(`✅ À temps (${ok.length}) : ${ok.join(', ')||'–'}`);
  if(late.length) L.push(`🕒 En retard, pénalité ${c.tauxRetard} % (${late.length}) : ${late.join(', ')}`);
  if(fm.length) L.push(`🛡️ Force majeure (${fm.length}) : ${fm.join(', ')}`);
  if(due.length) L.push(`⏳ Non reçu (${due.length}) : ${due.join(', ')}\nÀ régulariser avant mercredi ${fr(S2(w+4))} avec la pénalité de ${FF(c.cotisation*c.tauxRetard/100)}.`);
  L.push('',`Total cotisé du groupe : ${FF(tot)} / ${FF(ms.length*c.objectif)}`);
  L.push(`Prochaine échéance : samedi ${fr(S2(w+7))} à ${c.heure.replace(':','h')}`);
  return L.join('\n');
}

    </tbody></table></div></div>
  ${vRepart(now, ms, tres, redistBase)}`;
}
function vRepart(now, ms, tres, redistBase){
  const R=repartPenalites(); const pool=R.pool.sort(byOrdre);
  const totAct=ms.reduce((s,m)=>s+analyse(m,null,now).total,0);
  return `<div class="card"><div class="card-h"><h2>Répartition des intérêts, bonus et pénalités (art. 3)</h2><label style="flex-direction:row;align-items:center;gap:8px">Intérêts et bonus à répartir<input type="number" id="rd_m" value="${redistBase}" style="width:140px" data-keep="0"></label></div>
    <p class="small muted">Chaque pénalité est partagée dès son paiement entre les membres, au prorata de leurs cotisations cumulées à cette date. Les intérêts et bonus (par défaut ceux enregistrés en trésorerie : ${FF(tres)}) sont partagés au prorata des cotisations actuelles.</p>
    <div class="tbl"><table><thead><tr><th>Membre</th><th class="n">Cotisé</th><th class="n">Part actuelle</th><th class="n">Pénalités reçues</th><th class="n">Intérêts / bonus</th><th class="n">Total à recevoir</th></tr></thead><tbody>
    ${pool.map(m=>{const t=analyse(m,null,now).total; const act=m.statut==='actif'; const sh=act&&totAct?t/totAct:0; const ib=redistBase*sh; const pe=R.parM[m.id]||0; return `<tr><td>${esc(m.nom)}${act?'':' '+pill('mute','sorti')}</td><td class="n">${F(t)}</td><td class="n">${act?(sh*100).toFixed(2)+' %':'–'}</td><td class="n">${F(pe)}</td><td class="n">${F(ib)}</td><td class="n"><b>${F(pe+ib)}</b></td></tr>`;}).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="n">${F(totAct)}</td><td></td><td class="n">${F(R.total)}</td><td class="n">${F(redistBase)}</td><td class="n">${F(R.total+redistBase)}</td></tr></tfoot></table></div>
  </div>
  <div class="card"><div class="card-h"><h2>Détail de la répartition de chaque pénalité</h2><span class="small muted">${R.rows.length} pénalités · ${FF(R.total)}</span></div>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Payée par</th><th class="n">Pénalité</th><th class="n">Base cotisée</th>${pool.map(m=>`<th class="n">${esc(m.nom.split(' ')[0])}</th>`).join('')}</tr></thead><tbody>
    ${R.rows.length?R.rows.map(r=>`<tr><td>${fr(r.p.date)}</td><td>${esc(memById(r.p.membreId)?.nom||'?')}</td><td class="n">${F(r.p.penalite)}</td><td class="n">${F(r.tot)}</td>${pool.map(m=>`<td class="n">${r.parts[m.id]!=null?r.parts[m.id].toFixed(2).replace('.',','):''}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${4+pool.length}" class="empty">Aucune pénalité payée.</td></tr>`}
    </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${F(R.total)}</td><td></td>${pool.map(m=>`<td class="n">${(R.parM[m.id]||0).toFixed(2).replace('.',',')}</td>`).join('')}</tr></tfoot></table></div>
  </div>`;
}
function sortHint(){
  const el=document.getElementById('s_hint'); if(!el) return; const c=cfg();
  const m=memById(v('s_m')); const d=v('s_d'); if(!m||!d){el.textContent='';return;}
  const cot=S.cots.filter(p=>p.membreId===m.id && p.date<=d).reduce((s,p)=>s+(+p.montant||0),0);
  const pen=Math.round(cot*c.tauxSortie/100);
  const vers = v('s_t')==='demission' ? addMonth(d) : d;
  el.textContent=`Cotisé au ${fr(d)} : ${FF(cot)} · pénalité ${c.tauxSortie} % : ${FF(pen)} · à restituer : ${FF(cot-pen)}${v('s_t')==='demission'?` à partir du ${fr(vers)} (fin du préavis)`:''}.`;
}
function addMonth(s){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(Date.UTC(y,m,d)); return dt.toISOString().slice(0,10); }

  add('Membres',[['Nom','Statut','Rôle','Contact','Parrain','1er samedi dû','Sortie','Date sortie','Restitué'],...[...S.membres].sort(byOrdre).map(m=>[m.nom,m.statut,m.role||'',m.contact||'',memById(m.parrain)?.nom||'',fr(m.debut),m.sortie?.type||'',fr(m.sortie?.date),m.sortie?.restitue??''])],[26,12,12,30,26,12,10,11,10]);
  add('Trésorerie',[['Date','Type','Libellé','Montant','Accord'],...[...S.tres].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{const T=TRES_TYPES[t.type]||{l:t.type,sign:1}; return [fr(t.date),T.l,t.libelle||'',T.sign*(+t.montant||0),t.accord||''];}),[],['Solde théorique','','',soldeTheorique(),''],['Dernier relevé MoMo',c.releve?fr(c.releve.date):'','',c.releve?.solde??'','']],[12,28,34,12,40]);

function telecharger(blob, name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
function backupJson(){
  const strip=a=>a.map(o=>{const c={...o}; return c;});
  const data={version:1, exporte:stamp(), config:S.cfg, membres:strip(S.membres), cotisations:strip(S.cots), forcemajeure:strip(S.fm), tresorerie:strip(S.tres), decisions:strip(S.decs), scrutins:S.scrutins.map(x=>({...x, votes:S.votes[x.id]||[]}))};
  telecharger(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}), `ADF_sauvegarde_${nowLocal().date}.json`);
  toast('Sauvegarde téléchargée.');
}
async function importJson(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(_){ toast('Fichier illisible.'); return; }
  const map={membres:'membres',cotisations:'cotisations',forcemajeure:'forcemajeure',tresorerie:'tresorerie',decisions:'decisions'};
  const writes=[]; if(d.config) writes.push(['adf','config',d.config]);
  for(const [k,col] of Object.entries(map)) for(const o of (d[k]||[])){ const c={...o}; const id=c.id; delete c.id; if(id) writes.push([col,id,c]); }
  for(const sc of (d.scrutins||[])){ const c={...sc}; const id=c.id; const vs=c.votes||[]; delete c.id; delete c.votes; if(!id) continue; writes.push(['scrutins',id,c]); /* les bulletins individuels ne sont pas réimportés : seul chaque membre peut écrire son vote */ }
  if(!writes.length){ toast('Aucune donnée dans ce fichier.'); return; }
  try{
    for(let i=0;i<writes.length;i+=400){ const b=db.batch(); for(const [col,id,data] of writes.slice(i,i+400)) b.set(db.collection(col).doc(id),data); await b.commit(); }
    toast(`${writes.length} enregistrements importés.`);
  }catch(e){ toast(e?.code==='permission-denied'?"Import refusé : réservé au bureau.":'Import interrompu, réessayez.'); }
}

  if(a==='noConfirm'){ S.confirm=null; render(); return; }

  }
  if(f==='fCot'){
    const d={membreId:v('c_m'), date:v('c_d'), heure:v('c_h'), montant:+v('c_a')||0, penalite:+v('c_p')||0, obs:v('c_o')};
    if(!d.membreId||!d.date||d.montant<=0){ toast('Indiquez le membre, la date et un montant.'); return; }
    if(S.editCot){ const old=S.cots.find(p=>p.id===S.editCot); d.cree=old?.cree||stamp(); if(await save(COLS.cots,S.editCot,d)){ S.editCot=null; toast('Versement modifié.'); render(); } }
    else { d.cree=stamp(); if(await save(COLS.cots,null,d)){ toast(`Versement de ${FF(d.montant)} enregistré pour ${memById(d.membreId).nom}.`); const a=document.getElementById('c_a'); if(a) a.value=c.cotisation; const o=document.getElementById('c_o'); if(o) o.value=''; const p=document.getElementById('c_p'); if(p){p.dataset.touched='';} updHint(); } }
  }
  if(f==='fMem'){
    const d={nom:v('m_n'), contact:v('m_c'), parrain:v('m_p'), debut:v('m_d'), statut:v('m_s'), role:v('m_r')};
    if(!d.nom){ toast('Le nom est obligatoire.'); return; }
    if(D(d.debut)!==nextSat(D(d.debut))){ toast('Le 1er samedi dû doit être un samedi.'); return; }
    if(S.editMem){ const old=memById(S.editMem); const o=Object.assign({},old,d); delete o.id; if(await save(COLS.membres,S.editMem,o)){ S.editMem=null; toast('Membre mis à jour.'); render(); } }
    else { d.ordre=S.membres.length+1; if(await save(COLS.membres,null,d)) { toast(`${d.nom} ajouté.`); render(); } }
  }
  if(f==='fFM'){
    const d={membreId:v('f_m'), semaine:v('f_w'), dateDemande:v('f_d'), heureDemande:v('f_h'), statut:v('f_s'), motif:v('f_o')};
    if(d.statut==='validee'){ const n=S.fm.filter(x=>x.membreId===d.membreId&&x.statut==='validee').length; if(n>=c.maxFM){ toast('Ce membre a déjà utilisé ses '+c.maxFM+' dérogations.'); return; } }
    if(await save(COLS.fm,null,d)) toast('Demande enregistrée.');
  }
  if(f==='fTres'){
    const d={type:v('t_t'), date:v('t_d'), montant:+v('t_m')||0, libelle:v('t_l'), accord:v('t_a')};
    if(d.montant<=0){ toast('Indiquez un montant.'); return; }
    if(TRES_TYPES[d.type].sign<0 && !d.accord){ toast("Une sortie exige la référence de l'accord unanime (art. 6)."); return; }
    if(d.type==='invest' && !actifs().every(m=>analyse(m).total>=c.objectif/2)){ toast("Investissement refusé : tous les membres n'ont pas atteint 50 % (art. 4)."); return; }
    if(await save(COLS.tres,null,d)){ toast('Mouvement enregistré.'); ['t_m','t_l','t_a'].forEach(i=>{const el=document.getElementById(i); if(el) el.value='';}); }
  }
  if(f==='fRel'){
    const s=+v('r_s'); if(!(s>=0) || v('r_s')===''){ toast('Indiquez le solde lu sur la SIM.'); return; }
    if(await save('adf','config',Object.assign({},cfg(),{releve:{solde:s,date:v('r_d')}}))) toast('Relevé enregistré.');
  }
  if(f==='fDec'){
    const votes={}; for(const m of actifs()){ const x=v('vote_'+m.id); if(x) votes[m.id]=x; }
    const n=Object.keys(votes).length; let res=v('d_r');
    if(!res && n){ const p=Object.values(votes).filter(x=>x==='pour').length; const tot=actifs().length; res = p===tot?`Adopté à l'unanimité (${p}/${tot})`:p>n/2?`Adopté à la majorité (${p} pour sur ${n} votants)`:`Rejeté (${p} pour sur ${n} votants)`; }
    const d={date:v('d_d'), type:v('d_t'), objet:v('d_o'), resultat:res, responsable:v('d_p'), lien:v('d_l'), votes};
    if(!d.objet){ toast("Indiquez l'objet."); return; }
    if(await save(COLS.decs,null,d)){ toast('Enregistré.'); render(); }
  }
  if(f==='fSort'){
    const m=memById(v('s_m')); const d=v('s_d'); const type=v('s_t');
    const cot=S.cots.filter(p=>p.membreId===m.id && p.date<=d).reduce((s,p)=>s+(+p.montant||0),0);
    const pen=Math.round(cot*c.tauxSortie/100);
    const o=Object.assign({},m); delete o.id;
    o.statut=type; o.sortie={type,date:d,cotise:cot,penalite:pen,restitue:cot-pen,versement:type==='demission'?addMonth(d):d};
    if(await save(COLS.membres,m.id,o)){ toast(`Sortie de ${m.nom} enregistrée.`); render(); }
  }
  if(f==='fCfg'){
    const n=k=>+v(k);
    const d=Object.assign({},cfg(),{cotisation:n('p_c'),objectif:n('p_o'),debut:v('p_d'),semaines:n('p_s'),echeance:v('p_e'),heure:v('p_h'),tauxRetard:n('p_r'),tauxSortie:n('p_x'),tauxCloture:n('p_k'),tauxJour:n('p_j'),maxFM:n('p_f'),
      bureau:{president:v('p_bp'),tresorier:v('p_bt'),secretaire:v('p_bs')}, sim:{titulaire:v('p_st'),code:v('p_sc'),garde:v('p_sg')}});
    if(D(d.debut)!==nextSat(D(d.debut))){ toast('Le 1er jour du cycle doit être un samedi.'); return; }
    if(await save('adf','config',d)) toast('Paramètres enregistrés.');
  }
});
// rafraîchit l'horloge (semaine, retards) toutes les minutes sans écrire
setInterval(()=>{ const ae=document.activeElement; if(!ae || !['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)) render(true); }, 60000);
render();
boot();
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
